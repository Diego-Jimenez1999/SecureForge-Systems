server.port=8080

spring.datasource.url=jdbc:h2:file:./secureforge_db;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

upload.dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_FROM_ADDRESS:}
spring.mail.password=${MAIL_FROM_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

mail.from.address=${MAIL_FROM_ADDRESS:}
mail.admin.address=${MAIL_ADMIN_ADDRESS:}

app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080
